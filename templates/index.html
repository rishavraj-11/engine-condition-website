<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Intelligence</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <header>
            <p class="eyebrow">MACHINE INTELLIGENCE / 01</p>
            <h1>Engine Condition</h1>
            <p class="subtitle">
                Enter sensor readings to predict engine condition.
            </p>
        </header>

        <form id="sensor-form">
            <h2>Sensor Readings</h2>

            <div class="grid">
                <label>Vibration Amplitude (mm/s²)
                <input name="Vibration_Amplitude"
                    type="number" min="0.1" max="10"
                    step="any" placeholder="0.1 – 10.0" required>
            </label>

            <label>RMS Vibration (mm/s²)
                <input name="RMS_Vibration"
                    type="number" min="0.05" max="5"
                    step="any" placeholder="0.05 – 5.0" required>
            </label>

            <label>Vibration Frequency (Hz)
                <input name="Vibration_Frequency"
                    type="number" min="20" max="2000"
                    step="any" placeholder="20 – 2000" required>
            </label>

            <label>Surface Temperature (°C)
                <input name="Surface_Temperature"
                    type="number" min="30" max="150"
                    step="any" placeholder="30 – 150" required>
            </label>

            <label>Exhaust Temperature (°C)
                <input name="Exhaust_Temperature"
                    type="number" min="200" max="600"
                    step="any" placeholder="200 – 600" required>
            </label>

            <label>Acoustic Level (dB)
                <input name="Acoustic_dB"
                    type="number" min="60" max="120"
                    step="any" placeholder="60 – 120" required>
            </label>

            <label>Acoustic Frequency (Hz)
                <input name="Acoustic_Frequency"
                    type="number" min="100" max="5000"
                    step="any" placeholder="100 – 5000" required>
            </label>

            <label>Intake Pressure (kPa)
                <input name="Intake_Pressure"
                    type="number" min="90" max="120"
                    step="any" placeholder="90 – 120" required>
            </label>

            <label>Exhaust Pressure (kPa)
                <input name="Exhaust_Pressure"
                    type="number" min="80" max="110"
                    step="any" placeholder="80 – 110" required>
            </label>

            <label>Frequency Band Energy
                <input name="Frequency_Band_Energy"
                    type="number" min="0"
                    step="any" placeholder="Enter energy value" required>
            </label>

            <label>Amplitude Mean (arbitrary units)
                <input name="Amplitude_Mean"
                    type="number" min="0.01" max="0.5"
                    step="any" placeholder="0.01 – 0.5" required>
            </label>
            </div>

            <button id="predict-btn" type="submit">
                Predict Condition
            </button>
        </form>

        <section id="result" class="result" hidden aria-live="polite">
            <p class="eyebrow">MODEL OUTPUT</p>
            <h2 id="condition">—</h2>
            <p id="probabilities"></p>
        </section>

        <p id="message" role="status"></p>
        <footer>Local Engine Intelligence · ML Prediction</footer>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
